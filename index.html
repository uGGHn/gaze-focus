<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>注视对焦</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：照片铺满全屏，控件悬浮在上下两条安全区内 */
:root{
  --bg:#0b0d10; --fg:#eef1f4; --muted:#9aa3ad;
  --chip:rgba(16,20,26,.72); --line:rgba(255,255,255,.16); --accent:#ffb547;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font:14px/20px -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;display:flex;align-items:center;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 16px);justify-content:center}
.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);flex-wrap:wrap}
.glass{background:var(--chip);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.seg{display:flex;gap:4px;padding:4px;border-radius:20px;pointer-events:auto}
.seg button{height:32px;padding:0 16px;border:0;border-radius:16px;background:transparent;color:var(--muted);font:inherit}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btn{height:40px;padding:0 16px;border-radius:20px;color:var(--fg);font:inherit;pointer-events:auto}
.btn:disabled{color:var(--muted);opacity:.5}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#status{flex:1 1 100%;font-size:12px;line-height:16px;text-shadow:0 1px 4px #000}
#status.err{font-size:14px;line-height:20px;padding:8px 12px;border-radius:12px;background:var(--chip);color:var(--accent);text-shadow:none}
.spacer{flex:1}
#dot{position:fixed;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border:2px solid var(--fg);border-radius:50%;
  box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none;opacity:.8;will-change:transform}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 48px);background:rgba(0,0,0,.32)}
.overlay h1{font-size:24px;line-height:32px;font-weight:600;text-align:center;text-wrap:balance}
.overlay p{font-size:14px;line-height:20px;color:var(--muted);text-align:center;max-width:320px}
.primary{width:100%;max-width:320px;height:48px;border:0;border-radius:24px;background:var(--accent);color:#1a1206;font:inherit;font-size:16px;font-weight:600}
.link{height:40px;border:0;background:none;color:var(--fg);font:inherit}
#calib{justify-content:center;background:rgba(0,0,0,.72)}
#calDot{position:fixed;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 8px rgba(255,181,71,.24);transition:transform .4s ease}
#calDot.collect{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 4px rgba(255,181,71,.6)}}
@media (prefers-reduced-motion:reduce){#calDot{transition:none}#calDot.collect{animation:none}}
#calText{font-size:16px;line-height:24px;text-align:center}
video{position:fixed;width:4px;height:4px;opacity:0;pointer-events:none;left:0;top:0}
</style>

</head><body>
<canvas id="gl"></canvas>
<div id="dot"></div>

<div class="bar top">
  <div class="seg glass" role="group" aria-label="模糊方式">
    <button id="mA" aria-pressed="false">A 径向</button>
    <button id="mB" aria-pressed="true">B 景深</button>
  </div>
</div>

<div class="bar bottom">
  <div id="status">准备中…</div>
  <div class="seg glass" role="group" aria-label="输入方式">
    <button id="iEye" aria-pressed="false">眼睛</button>
    <button id="iFinger" aria-pressed="true">手指</button>
  </div>
  <div class="spacer"></div>
  <button id="calBtn" class="btn glass" disabled>校准</button>
</div>

<div id="start" class="overlay">
  <h1>看哪里，哪里就清晰</h1>
  <p>前置摄像头估计你的视线。画面只在本机处理，不上传。</p>
  <button id="goEye" class="primary">开启摄像头</button>
  <button id="goFinger" class="link">先用手指试 →</button>
</div>

<div id="calib" class="overlay" hidden>
  <div id="calDot"></div>
  <div id="calText">盯住圆点</div>
</div>

<video id="cam" playsinline muted autoplay></video>

<script>
(() => {
const $ = id => document.getElementById(id);
// 模型与运行库和页面放在同一文件夹，国内网络也能加载
const MP = new URL('./mp', location.href).href;
const MODEL = MP + '/face_landmarker.task';
const LEVELS = [0, 1.5, 3, 6, 10, 16];   // 每级模糊半径（CSS px）

const state = {
  mode: 'B', input: 'finger',
  gx: innerWidth / 2, gy: innerHeight * 0.45,   // 显示中的注视点（CSS px）
  tx: innerWidth / 2, ty: innerHeight * 0.45,   // 目标注视点
  focus: 0.1, scene: null,
  fl: null, stream: null, model: null, faceOK: false,
  collecting: -1, samples: [], calibrating: false,
};

function setStatus(t, err){ const el = $('status'); el.textContent = t; el.classList.toggle('err', !!err); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- 演示照片：程序生成，自带精确深度 ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function buildScene(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const cw = innerWidth, ch = innerHeight;
  const W = Math.round(cw * dpr), H = Math.round(ch * dpr);
  const hz = H * 0.42, f = H * 0.9, camH = 1.6, cx = W / 2;
  const col = document.createElement('canvas'); col.width = W; col.height = H;
  const dep = document.createElement('canvas'); dep.width = W; dep.height = H;
  const c = col.getContext('2d'), d = dep.getContext('2d');
  const ci = c.createImageData(W, H), di = d.createImageData(W, H);
  const cp = ci.data, dp = di.data;
  const sky0 = [29, 42, 74], sky1 = [240, 163, 107];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4; let r, g, b, n = 0;
      if (y < hz) {
        const t = Math.pow(y / hz, 1.6);
        r = sky0[0] + (sky1[0] - sky0[0]) * t; g = sky0[1] + (sky1[1] - sky0[1]) * t; b = sky0[2] + (sky1[2] - sky0[2]) * t;
      } else {
        const z = f * camH / Math.max(y - hz, 0.5), wx = (x - cx) * z / f;
        const h = ((Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1 + 1) % 1;
        if (Math.abs(wx) < 1.2) {
          const ux = (wx + 12) / 0.6, uz = z / 0.6;
          const k = (Math.floor(ux) + Math.floor(uz)) & 1;
          const grout = (ux % 1) < 0.05 || (uz % 1) < 0.05;
          const v = grout ? 70 : (k ? 150 : 132) + h * 14;
          r = v; g = v * 0.93; b = v * 0.86;
        } else {
          const s = Math.floor(z) & 1;
          r = 52 + h * 18 + s * 6; g = 92 + h * 26 + s * 8; b = 48 + h * 10;
        }
        const fog = 1 - Math.exp(-z / 30);
        r += (sky1[0] - r) * fog; g += (sky1[1] - g) * fog; b += (sky1[2] - b) * fog;
        n = Math.min(1, 1 / z);
      }
      cp[i] = r; cp[i + 1] = g; cp[i + 2] = b; cp[i + 3] = 255;
      dp[i] = dp[i + 1] = dp[i + 2] = n * 255; dp[i + 3] = 255;
    }
  }
  c.putImageData(ci, 0, 0); d.putImageData(di, 0, 0);

  const P = (x, y, z) => [cx + f * x / z, hz + f * (camH - y) / z];
  const gray = z => { const v = Math.round(Math.min(1, 1 / z) * 255); return `rgb(${v},${v},${v})`; };
  const R = rng(7), objs = [];

  // 远山
  for (const [z, colr, amp, seed] of [[200, '#4b4466', 0.10, 3], [90, '#3a3550', 0.07, 9]]) {
    objs.push({ z, draw(x, D) {
      const r2 = rng(seed); x.beginPath(); x.moveTo(0, hz + 2);
      for (let px = 0; px <= W; px += W / 24) x.lineTo(px, hz - H * amp * (0.4 + 0.6 * r2()));
      x.lineTo(W, hz + 2); x.closePath(); x.fillStyle = D ? gray(z) : colr; x.fill();
    }});
  }
  // 天灯
  for (let k = 0; k < 9; k++) {
    const z = 9 + R() * 34, wx = (R() - 0.5) * z * 0.9, wy = 4 + R() * 6;
    objs.push({ z, draw(x, D) {
      const [sx, sy] = P(wx, wy, z), s = f * 0.35 / z;
      if (!D) { const g = x.createRadialGradient(sx, sy, 0, sx, sy, s * 3); g.addColorStop(0, 'rgba(255,190,90,.35)'); g.addColorStop(1, 'rgba(255,190,90,0)');
        x.fillStyle = g; x.fillRect(sx - s * 3, sy - s * 3, s * 6, s * 6); }
      x.beginPath(); x.roundRect ? x.roundRect(sx - s * 0.6, sy - s, s * 1.2, s * 2, s * 0.4) : x.rect(sx - s * 0.6, sy - s, s * 1.2, s * 2);
      if (D) x.fillStyle = gray(z); else { const g = x.createLinearGradient(sx, sy - s, sx, sy + s); g.addColorStop(0, '#ffe2a8'); g.addColorStop(1, '#e0772a'); x.fillStyle = g; }
      x.fill();
    }});
  }
  // 路灯
  for (const z of [3, 5, 7.5, 11, 16, 23, 33, 48]) for (const side of [-1.8, 1.8]) {
    objs.push({ z, draw(x, D) {
      const [bx, by] = P(side, 0, z), [tx, ty] = P(side, 2.3, z), w = Math.max(1, f * 0.07 / z), r = f * 0.2 / z;
      x.fillStyle = D ? gray(z) : '#2a2622'; x.fillRect(bx - w / 2, ty, w, by - ty);
      if (!D) { const g = x.createRadialGradient(tx, ty, 0, tx, ty, r * 4); g.addColorStop(0, 'rgba(255,181,71,.45)'); g.addColorStop(1, 'rgba(255,181,71,0)');
        x.fillStyle = g; x.fillRect(tx - r * 4, ty - r * 4, r * 8, r * 8); }
      x.beginPath(); x.arc(tx, ty, r, 0, Math.PI * 2);
      if (D) x.fillStyle = gray(z); else { const g = x.createRadialGradient(tx - r * 0.3, ty - r * 0.3, 0, tx, ty, r); g.addColorStop(0, '#fff4d0'); g.addColorStop(0.5, '#ffb547'); g.addColorStop(1, '#c4621e'); x.fillStyle = g; }
      x.fill();
    }});
  }
  // 婚礼拱门
  objs.push({ z: 9, draw(x, D) {
    const z = 9, [l0x, l0y] = P(-1.4, 0, z), [r0x] = P(1.4, 0, z), [, topY] = P(0, 2.2, z);
    const rad = (r0x - l0x) / 2, mid = (l0x + r0x) / 2, w = f * 0.14 / z;
    x.lineWidth = w; x.strokeStyle = D ? gray(z) : '#f4efe8'; x.lineCap = 'butt';
    x.beginPath(); x.moveTo(l0x, l0y); x.lineTo(l0x, topY); x.arc(mid, topY, rad, Math.PI, 0); x.lineTo(r0x, l0y); x.stroke();
    const r3 = rng(21);
    for (let k = 0; k < 26; k++) { const a = Math.PI + r3() * Math.PI, fr = f * (0.08 + r3() * 0.06) / z;
      x.beginPath(); x.arc(mid + Math.cos(a) * rad, topY + Math.sin(a) * rad, fr, 0, Math.PI * 2);
      x.fillStyle = D ? gray(z) : ['#f7c6d0', '#ffffff', '#e8909f', '#9fbf8a'][k % 4]; x.fill(); }
  }});
  // 前景花枝
  objs.push({ z: 1.1, draw(x, D) {
    const z = 1.1, r4 = rng(5), g = gray(z);
    const pts = []; for (let k = 0; k <= 12; k++) { const t = k / 12; pts.push(P(-0.56 + t * 0.46, 1.36 - t * t * 0.14, z)); }
    x.lineWidth = f * 0.016 / z; x.strokeStyle = D ? g : '#3b2a20'; x.beginPath(); pts.forEach(([px, py], k) => k ? x.lineTo(px, py) : x.moveTo(px, py)); x.stroke();
    for (let k = 1; k < pts.length; k++) {
      const [px, py] = pts[k], s = f * 0.03 / z;
      for (let j = 0; j < 2; j++) { x.save(); x.translate(px, py); x.rotate((r4() - 0.5) * 2.4 + (j ? 0.8 : -0.8));
        x.beginPath(); x.ellipse(s, 0, s, s * 0.4, 0, 0, Math.PI * 2); x.fillStyle = D ? g : (j ? '#4f7d3c' : '#3d6630'); x.fill(); x.restore(); }
      if (k % 2 === 0) { x.beginPath(); x.arc(px + (r4() - 0.5) * s, py - s * 0.6, s * 0.7, 0, Math.PI * 2); x.fillStyle = D ? g : '#f2a7b8'; x.fill();
        if (!D) { x.beginPath(); x.arc(px + (r4() - 0.5) * s, py - s * 0.6, s * 0.2, 0, Math.PI * 2); x.fillStyle = '#ffe08a'; x.fill(); } }
    }
  }});

  objs.sort((a, b) => b.z - a.z);
  for (const o of objs) { o.draw(c, false); o.draw(d, true); }

  // 模糊层级（3 次盒式模糊近似高斯，逐级累加）
  const base = c.getImageData(0, 0, W, H).data;
  const levels = [base]; let prevS = 0, cur = base;
  for (let k = 1; k < LEVELS.length; k++) {
    const s = LEVELS[k] * dpr, inc = Math.sqrt(s * s - prevS * prevS); prevS = s;
    cur = gauss(cur, W, H, inc); levels.push(cur);
  }
  const depth = d.getImageData(0, 0, W, H).data;
  return { W, H, dpr, levels, depth };
}

function boxSizes(sigma, n){
  const wIdeal = Math.sqrt(12 * sigma * sigma / n + 1); let wl = Math.floor(wIdeal); if (wl % 2 === 0) wl--;
  const wu = wl + 2, m = Math.round((12 * sigma * sigma - n * wl * wl - 4 * n * wl - 3 * n) / (-4 * wl - 4));
  return Array.from({ length: n }, (_, i) => ((i < m ? wl : wu) - 1) / 2);
}
function gauss(src, w, h, sigma){
  let a = new Uint8ClampedArray(src), b = new Uint8ClampedArray(src.length);
  for (const r of boxSizes(sigma, 3)) { if (r < 1) continue; pass(a, b, w, h, r, 4, w * 4, w); pass(b, a, w, h, r, w * 4, 4, h); }
  return a;
}
// 沿一个方向做盒式模糊：step=相邻像素步长，lineStep=行步长，len=该方向像素数
function pass(src, dst, w, h, r, step, lineStep, len){
  const lines = step === 4 ? h : w, inv = 1 / (2 * r + 1), last = len - 1;
  for (let l = 0; l < lines; l++) {
    const o = l * lineStep;
    for (let c = 0; c < 3; c++) {
      let v = 0;
      for (let k = -r; k <= r; k++) v += src[o + Math.min(Math.max(k, 0), last) * step + c];
      for (let p = 0; p < len; p++) {
        dst[o + p * step + c] = v * inv;
        v += src[o + Math.min(p + r + 1, last) * step + c] - src[o + Math.max(p - r, 0) * step + c];
      }
    }
    for (let p = 0; p < len; p++) dst[o + p * step + 3] = 255;
  }
}

/* ---------- WebGL：按模糊量在 6 个层级间插值 ---------- */
const cv = $('gl'), gl = cv.getContext('webgl', { antialias: false, premultipliedAlpha: false });
const VS = 'attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
const FS = `precision mediump float;varying vec2 v;
uniform sampler2D t0,t1,t2,t3,t4,t5,tD;uniform vec2 uG;uniform float uMode,uFocus,uAsp;
void main(){
  float c;
  if(uMode<.5){vec2 d=v-uG;d.x*=uAsp;c=clamp((length(d)-.06)/.45,0.,1.)*5.;}
  else{float n=texture2D(tD,v).r;c=clamp(abs(n-uFocus)/.3,0.,1.)*5.;}
  vec3 col=texture2D(t0,v).rgb;
  col=mix(col,texture2D(t1,v).rgb,clamp(c,0.,1.));
  col=mix(col,texture2D(t2,v).rgb,clamp(c-1.,0.,1.));
  col=mix(col,texture2D(t3,v).rgb,clamp(c-2.,0.,1.));
  col=mix(col,texture2D(t4,v).rgb,clamp(c-3.,0.,1.));
  col=mix(col,texture2D(t5,v).rgb,clamp(c-4.,0.,1.));
  gl_FragColor=vec4(col,1.);
}`;
function sh(t, s){ const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const ap = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const texs = [];
for (let i = 0; i < 7; i++) {
  const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(U(i < 6 ? 't' + i : 'tD'), i); texs.push(t);
}
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

function upload(sc){
  cv.width = sc.W; cv.height = sc.H; gl.viewport(0, 0, sc.W, sc.H);
  [...sc.levels, sc.depth].forEach((data, i) => {
    gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, texs[i]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, sc.W, sc.H, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(data.buffer));
  });
}

function depthAt(x, y){
  const sc = state.scene; if (!sc) return 0;
  const r = 12 * sc.dpr, vals = [];
  for (let dy = -r; dy <= r; dy += r / 2) for (let dx = -r; dx <= r; dx += r / 2) {
    const px = Math.min(sc.W - 1, Math.max(0, Math.round(x * sc.dpr + dx)));
    const py = Math.min(sc.H - 1, Math.max(0, Math.round(y * sc.dpr + dy)));
    vals.push(sc.depth[(py * sc.W + px) * 4]);
  }
  vals.sort((a, b) => a - b); return vals[vals.length >> 1] / 255;
}

/* ---------- 眼动：MediaPipe 虹膜 + 5 点线性校准 ---------- */
function features(lm, vw, vh){
  const p = i => [lm[i].x * vw, lm[i].y * vh];
  const irises = [p(468), p(473)];
  const eye = (o, i, top, bot) => {
    const a = p(o), b = p(i), cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2, w = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const t = p(top), u = p(bot), open = Math.hypot(t[0] - u[0], t[1] - u[1]) / w;
    const ir = irises.reduce((m, q) => Math.hypot(q[0] - cx, q[1] - cy) < Math.hypot(m[0] - cx, m[1] - cy) ? q : m);
    return { x: (ir[0] - cx) / w, y: (ir[1] - cy) / w, open };
  };
  const L = eye(33, 133, 159, 145), R = eye(362, 263, 386, 374);
  if ((L.open + R.open) / 2 < 0.18) return null;   // 眨眼
  return [(L.x + R.x) / 2, (L.y + R.y) / 2];
}

function fit(samples){
  const solve = key => {
    const A = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], b = [0, 0, 0];
    for (const s of samples) { const r = [1, s.f[0], s.f[1]];
      for (let i = 0; i < 3; i++) { b[i] += r[i] * s[key]; for (let j = 0; j < 3; j++) A[i][j] += r[i] * r[j]; } }
    for (let i = 1; i < 3; i++) A[i][i] += 1e-6;
    for (let i = 0; i < 3; i++) { let m = i; for (let k = i + 1; k < 3; k++) if (Math.abs(A[k][i]) > Math.abs(A[m][i])) m = k;
      [A[i], A[m]] = [A[m], A[i]]; [b[i], b[m]] = [b[m], b[i]];
      for (let k = i + 1; k < 3; k++) { const q = A[k][i] / A[i][i]; for (let j = i; j < 3; j++) A[k][j] -= q * A[i][j]; b[k] -= q * b[i]; } }
    const x = [0, 0, 0]; for (let i = 2; i >= 0; i--) { let s = b[i]; for (let j = i + 1; j < 3; j++) s -= A[i][j] * x[j]; x[i] = s / A[i][i]; }
    return x;
  };
  return { x: solve('x'), y: solve('y') };
}
const predict = (m, f) => [m.x[0] + m.x[1] * f[0] + m.x[2] * f[1], m.y[0] + m.y[1] * f[0] + m.y[2] * f[1]];

async function startCamera(){
  if (!window.isSecureContext) throw new Error('需要 HTTPS 网址才能打开摄像头');
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('这个浏览器不支持摄像头');
  setStatus('请求摄像头…');
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
  } catch (e) {
    const embedded = (() => { try { return window.self !== window.top; } catch { return true; } })();
    if (embedded && (e.name === 'NotAllowedError' || e.name === 'SecurityError'))
      throw new Error('这个页面嵌在 Claude 里，系统不让它用摄像头，与你是否授权无关。眼睛模式请用 index.html 部署到 HTTPS 网址后打开');
    throw new Error(e.name === 'NotAllowedError' ? '摄像头被拒绝：请在浏览器网站设置里允许摄像头后重试' : '无法打开摄像头（' + e.name + '）');
  }
  const v = $('cam'); v.srcObject = state.stream; await v.play();
  setStatus('加载眼动模型…');
  try {
    const vision = await import(MP + '/vision_bundle.mjs');
    const files = await vision.FilesetResolver.forVisionTasks(MP + '/wasm');
    const opts = { baseOptions: { modelAssetPath: MODEL, delegate: 'GPU' }, runningMode: 'VIDEO', numFaces: 1 };
    try { state.fl = await vision.FaceLandmarker.createFromOptions(files, opts); }
    catch { opts.baseOptions.delegate = 'CPU'; state.fl = await vision.FaceLandmarker.createFromOptions(files, opts); }
  } catch (e) {
    state.stream.getTracks().forEach(t => t.stop()); state.stream = null;
    throw new Error('眼动模型加载失败（确认 mp 文件夹和网页一起上传了）：' + (e.message || e));
  }
}

async function calibrate(){
  if (!state.fl || state.calibrating) return;
  state.calibrating = true; $('calib').hidden = false;
  const pts = [[0.5, 0.5], [0.12, 0.12], [0.88, 0.12], [0.12, 0.88], [0.88, 0.88]];
  const dot = $('calDot'); state.samples = [];
  const counts = [];
  for (let i = 0; i < pts.length; i++) {
    const x = pts[i][0] * innerWidth, y = pts[i][1] * innerHeight;
    dot.style.transform = `translate(${x}px,${y}px)`; dot.classList.remove('collect');
    $('calText').textContent = `盯住圆点（${i + 1}/5）`;
    await sleep(800);
    dot.classList.add('collect'); const before = state.samples.length;
    state.collecting = i; state.cur = [x, y]; await sleep(1000); state.collecting = -1;
    counts.push(state.samples.length - before);
  }
  dot.classList.remove('collect'); $('calib').hidden = true; state.calibrating = false;
  if (counts.some(c => c < 5)) { setStatus('没检测到眼睛。把脸放在屏幕正前方，再点「校准」'); return; }
  state.model = fit(state.samples);
  try { localStorage.setItem('gazeModel', JSON.stringify(state.model)); } catch {}
}

/* ---------- 输入与模式 ---------- */
function setMode(m){ state.mode = m; $('mA').setAttribute('aria-pressed', m === 'A'); $('mB').setAttribute('aria-pressed', m === 'B'); }
async function setInput(m){
  state.input = m; $('iEye').setAttribute('aria-pressed', m === 'eye'); $('iFinger').setAttribute('aria-pressed', m === 'finger');
  $('calBtn').disabled = m !== 'eye';
  if (m === 'finger') { setStatus('手指模式：按住照片并拖动'); return; }
  try {
    if (!state.fl) await startCamera();
    if (!state.model) { try { state.model = JSON.parse(localStorage.getItem('gazeModel')); } catch {} }
    if (!state.model) await calibrate();
  } catch (e) {
    setStatus(e.message + '。已切换到手指模式', true); state.input = 'finger';
    $('iEye').setAttribute('aria-pressed', false); $('iFinger').setAttribute('aria-pressed', true); $('calBtn').disabled = true;
  }
}
$('mA').onclick = () => setMode('A'); $('mB').onclick = () => setMode('B');
$('iEye').onclick = () => setInput('eye'); $('iFinger').onclick = () => setInput('finger');
$('calBtn').onclick = calibrate;
$('goEye').onclick = () => { $('start').hidden = true; setInput('eye'); };
$('goFinger').onclick = () => { $('start').hidden = true; setInput('finger'); };
cv.addEventListener('pointerdown', e => { if (state.input === 'finger') { state.tx = e.clientX; state.ty = e.clientY; cv.setPointerCapture(e.pointerId); } });
cv.addEventListener('pointermove', e => { if (state.input === 'finger' && (e.buttons || e.pointerType === 'mouse')) { state.tx = e.clientX; state.ty = e.clientY; } });

/* ---------- 主循环 ---------- */
let lastT = performance.now(), lastVT = -1, lastStatus = 0;
function frame(t){
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
  const v = $('cam');
  if (state.input === 'eye' && state.fl && v.readyState >= 2 && v.currentTime !== lastVT) {
    lastVT = v.currentTime;
    const res = state.fl.detectForVideo(v, t), lm = res.faceLandmarks && res.faceLandmarks[0];
    state.faceOK = !!lm;
    if (lm) { const f = features(lm, v.videoWidth, v.videoHeight);
      if (f) {
        if (state.collecting >= 0) state.samples.push({ f, x: state.cur[0], y: state.cur[1] });
        else if (state.model) { const [px, py] = predict(state.model, f);
          state.tx = Math.min(innerWidth, Math.max(0, px)); state.ty = Math.min(innerHeight, Math.max(0, py)); }
      } }
    if (!state.calibrating && t - lastStatus > 400) { lastStatus = t;
      setStatus(!state.model ? '需要校准：点「校准」' : state.faceOK ? '眼睛模式：跟踪中。手机尽量保持不动' : '没检测到人脸'); }
  }
  // 平滑：大跳视为扫视，跟得快；小抖动跟得慢
  const jump = Math.hypot(state.tx - state.gx, state.ty - state.gy) / Math.min(innerWidth, innerHeight);
  const k = state.input === 'finger' ? 0.5 : jump > 0.15 ? 0.45 : 0.12;
  state.gx += (state.tx - state.gx) * k; state.gy += (state.ty - state.gy) * k;
  $('dot').style.transform = `translate(${state.gx}px,${state.gy}px)`;
  // 对焦过渡约 120ms，模拟眼睛调节
  state.focus += (depthAt(state.gx, state.gy) - state.focus) * (1 - Math.exp(-dt / 0.12));
  if (!state.scene) return;
  gl.uniform2f(U('uG'), state.gx / innerWidth, 1 - state.gy / innerHeight);
  gl.uniform1f(U('uMode'), state.mode === 'A' ? 0 : 1);
  gl.uniform1f(U('uFocus'), state.focus);
  gl.uniform1f(U('uAsp'), innerWidth / innerHeight);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function rebuild(){
  setStatus('生成照片…');
  setTimeout(() => {
    state.scene = buildScene(); upload(state.scene);
    state.focus = depthAt(state.gx, state.gy);
    if (state.input === 'finger') setStatus('手指模式：按住照片并拖动');
  }, 30);
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(rebuild, 300); });
rebuild(); requestAnimationFrame(frame);
})();
</script>

</body></html>
